[package]
name = "marlowe-exec"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
marlowe-contract.workspace = true
marlowe-loop.workspace = true
marlowe-permission.workspace = true
marlowe-tools.workspace = true
marlowe-net.workspace = true
# The extraction half. `marlowe-net` returns bytes; this turns them into text. Neither depends on
# the other — this crate is the only place the two meet, which is what keeps a parser bug out of
# the egress path.
marlowe-extract.workspace = true

[dev-dependencies]
# The `batch_parallelism` example drives the real `Engine`, which needs a `Recorder` and a
# `Clock`. Dev-only: nothing in the shipped executor touches the journal.
marlowe-journal.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["fs", "process"] }
